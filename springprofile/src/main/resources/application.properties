spring.application.name=spring-profiles-demo

# Change this value to dev, test, or prod and restart the application.
spring.profiles.active=dev

# Common fallback values. Profile-specific files override these values.
app.mail.environment-name=default
app.mail.mail-server-url=http://localhost:8080/default-mail-server
app.mail.support-email=support@javaguides.com
app.mail.send-real-emails=false
app.mail.welcome-subject=Welcome from Default Employee Management System
